<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Care Companion ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="gradient-bg min-h-screen">
    <!-- Password Gate -->
    <div id="passwordGate" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full fade-in">
            <h1 class="text-4xl font-bold text-center mb-6 text-pink-600">💕 Care 💕</h1>
            <h1 class="text-4xl font-bold text-center mb-6 text-pink-600">💕 Companion 💕</h1>
            <p class="text-center text-gray-600 mb-6">Bitte Passwort eingeben</p>
            <input 
                type="password" 
                id="passwordInput" 
                placeholder="Passwort" 
                class="w-full px-4 py-3 border-2 border-pink-300 rounded-lg focus:outline-none focus:border-pink-500 mb-4"
            />
            <button 
                id="enterButton"
                class="w-full btn-gradient text-white font-bold py-3 rounded-lg shadow-lg transition-all duration-300"
            >
                Eintreten
            </button>
            <p id="errorMessage" class="text-red-500 text-center mt-3 hidden">Falsches Passwort!</p>
        </div>
    </div>

    <!-- Main App Container (hidden initially) -->
    <div id="appContainer" class="hidden min-h-screen p-4">
        <div class="max-w-6xl mx-auto">
            <!-- Header (loaded from partial) -->
            <div id="headerContainer"></div>

            <!-- Main Content Area -->
            <div id="mainContent" class="fade-in"></div>

            <!-- Back button removed; header click returns to main page -->
            <div id="footerContainer"></div>
        </div>
    </div>

    <script src="https://cdn.emailjs.com/sdk/3.2.0/email.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
